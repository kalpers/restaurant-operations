name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: restaurant_ops
          POSTGRES_USER: restaurant_app
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurant_app -d restaurant_ops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throwaway credentials for the service above, which exists only for this job.
    env:
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://restaurant_app:ci_only_password@localhost:5432/restaurant_ops
      TEST_DATABASE_URL: postgresql://restaurant_app:ci_only_password@localhost:5432/restaurant_ops_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check production dependencies
        run: npm audit --omit=dev

      - name: Generate a throwaway session secret
        run: echo "NEXTAUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: npm run db:migrate

      - name: Check the schema matches the checked-in migrations
        run: |
          npm run db:generate
          git diff --exit-code drizzle/
          test -z "$(git status --porcelain drizzle/)"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build

      - name: Install the E2E browser
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      # Page snapshots and traces from the throwaway CI database, kept so a failure can be
      # diagnosed from the run itself.
      - name: Keep Playwright failure files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
